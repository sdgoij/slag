[package]
name = "v8"
# The version of the crate this stands in for, so a consumer pinning
# `v8 = "150.4.0"` resolves to this one. Deliberately not the workspace version.
version = "150.4.0"
edition.workspace = true
license.workspace = true

[lib]
path = "lib.rs"

[dependencies]
# `workers` is on because this boundary's `SharedRef` is thread-safe, as the crate
# we stand in for's is, and its payload — a `BackingStore`, whose bytes an
# `ArrayBuffer` shares with the views over it and which a host moves between
# agents — is only `Send + Sync` in that build of the block
# (`.notes/embedding.md` §9). Left to the caller, the boundary would type-check
# against a single-threaded engine and the gap would only show where a host
# actually shares a buffer.
runtime = { path = "../runtime", default-features = false, features = ["workers"] }
crux = { path = "../crux" }
# Every isolate compiles, so the JIT is a dependency of the boundary rather than
# a feature of it: V8 has no interpreted mode and a host cannot ask for one
# (`rusty_v8` links a JIT unconditionally), so a build of this crate without it
# would be a different engine wearing these names. See `.notes/embedding.md` §9.
jit = { path = "../jit" }
# For `fast_api::Flags`, which the crate we stand in for spells as a bitflags
# type; it is already in the workspace's lock, so this adds no new download.
bitflags = "2"
# The host-facing engine entry points come through the embedding API rather
# than from `runtime` directly. Its `wasm` feature is on here because the crate
# we stand in for always has WebAssembly: `v8::WasmModuleObject` and the rest
# exist in `rusty_v8` unconditionally, so a host never asks for them and must
# not have to. (The engine's own default is off, for slim embeddings that drop
# the `wasm` crate from the build; this bridge is not one of those.)
slag = { path = "../slag", default-features = false, features = ["wasm"] }

# Mirrors the feature surface the crate we stand in for declares, so a
# consumer's passthroughs (`features = ["simdutf"]`, `v8_use_custom_libcxx`, the
# `v8_enable_*` set) still resolve. None of them change how Slag builds.
[features]
default = ["use_custom_libcxx"]
use_custom_libcxx = []
simdutf = []
v8_enable_pointer_compression = []
v8_enable_sandbox = ["v8_enable_pointer_compression"]
v8_enable_v8_checks = []
