[package]
name = "slagc"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "slagc"
# `staticlib` is the artifact the C++ facade links; `rlib` lets this crate's own
# tests call the exported functions without going through the linker.
crate-type = ["staticlib", "rlib"]

[dependencies]
slag = { path = "../slag", default-features = false, features = ["wasm"] }
crux = { path = "../crux" }
# The parser's own source-position view, for the position a `v8::Message`
# reports (a compile error's span indexes the text that was compiled).
syntax = { path = "../syntax" }
# The Chrome DevTools Protocol session behind `v8_inspector` (see
# `inspector_abi`). The protocol is the inspector's own and stays host-side; the
# facade's C++ layer is only the V8-shaped shell around it.
inspector = { path = "../inspector" }
