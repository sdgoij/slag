[package]
name = "slag"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crux = { path = "../crux" }
# Defaults off so the `wasm` feature below is the single source of truth for
# the WebAssembly JS API; the runtime's other optional surfaces come through
# the pass-through features.
runtime = { path = "../runtime", default-features = false }
jit = { path = "../jit", optional = true }

[features]
# The WebAssembly JS API: on by default (drop it with `--no-default-features`
# for a minimal embed build).
default = ["wasm"]
wasm = ["runtime/wasm"]
# Cut 11: run wasm bodies natively (native targets only). On by default for
# native builds — `runtime` activates `wasm/compile` from a
# `cfg(not(target_arch = "wasm32"))` table, which is also why the
# `wasm32-unknown-unknown` example build needs no extra flags. This feature is
# only an explicit request (and on wasm32 a hard error); see the runtime's
# `wasm-compile`.
wasm-compile = ["runtime/wasm-compile"]
# The Cranelift JIT hook (`install_jit`); off by default so embedders who do
# not need it avoid the Cranelift dependency tree.
jit = ["dep:jit"]
# Pass-throughs of the runtime's own optional surfaces.
workers = ["runtime/workers"]
fs = ["runtime/fs"]
# The raylib host module (`rl.*`); compiles raylib's C library (needs a
# display). See `crates/runtime/src/raylib.rs`.
raylib = ["runtime/raylib"]
# The raygui control set (`rl.gui*`), a separate opt-in on top of `raylib`;
# implies it so the host module is actually installed.
raygui = ["raylib", "runtime/raygui"]
# Skin animated models in the shader instead of on the CPU; implies `raylib`
# and changes raylib's own build. See `runtime`'s `gpu-skinning`.
gpu-skinning = ["raylib", "runtime/gpu-skinning"]
