[package]
name = "runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crux = { path = "../crux" }
lexer = { path = "../lexer" }
parser = { path = "../parser" }
wasm = { path = "../wasm", optional = true }
# Trimmed raylib build. Keep `SUPPORT_WINMM_HIGHRES_TIMER`: without it,
# raylib's Windows frame limiter uses the ~15.6ms Sleep granularity and
# `SetTargetFPS(60)` paces at ~30ms/frame instead of 16.6. `SUPPORT_FILEFORMAT_GLTF`
# backs `rl.loadModel`; it is off raylib-sys's own `default` set here because
# this dependency drops default features. `SUPPORT_FILEFORMAT_JPG` is likewise off
# that set, and without it raylib compiles stb_image with `STBI_NO_JPEG` and
# decodes every embedded JPEG glTF texture to an empty image (the model then
# draws with no albedo/normal map).
raylib-sys = { version = "6.0.0", default-features = false, features = ["SUPPORT_MODULE_RSHAPES", "SUPPORT_MODULE_RTEXTURES", "SUPPORT_MODULE_RTEXT", "SUPPORT_MODULE_RMODELS", "SUPPORT_MODULE_RAUDIO", "USE_AUDIO", "SUPPORT_FILEFORMAT_PNG", "SUPPORT_FILEFORMAT_JPG", "SUPPORT_FILEFORMAT_WAV", "SUPPORT_FILEFORMAT_GLTF", "SUPPORT_TRACELOG", "SUPPORT_WINMM_HIGHRES_TIMER"], optional = true }
regexp = { path = "../regexp" }
syntax = { path = "../syntax" }
unicode = { path = "../unicode" }

# The stack-exhaustion guard's thread-stack query (unix platforms).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `default-features = false` above drops raylib-sys's default `GLFW_BUILD_X11`,
# and raylib's cmake aborts on Linux desktops when both GLFW platform backends
# are off ("Cannot disable both Wayland and X11"), so Linux must enable one
# explicitly. Wayland suits the Asahi/Fedora dev host; an X11-only host should
# swap this for `GLFW_BUILD_X11` (which needs the X11 extension dev headers:
# xrandr, xinerama, xcursor, xi). Scoped to Linux so Windows/macOS builds keep
# their native GLFW backends (Cargo only applies features from the target
# tables matching the platform being built).
[target.'cfg(target_os = "linux")'.dependencies]
raylib-sys = { version = "6.0.0", default-features = false, features = ["GLFW_BUILD_WAYLAND"], optional = true }

[features]
# The WebAssembly JS API (`WebAssembly` global): on by default. The engine
# is a full dependency and per-realm install, so a build that does not want
# it drops the feature (and the `wasm` crate) with `--no-default-features`.
default = ["wasm"]
wasm = ["dep:wasm"]
# Experimental multi-agent mode (PLAN Phase 17): workers run as OS threads
# with their own realms and job queues, sharing SharedArrayBuffer blocks
# with the main agent; Atomics.wait blocks and notify wakes via a global
# waiter registry.
workers = ["crux/workers"]
# Host-filesystem globals (`fs.readFileSync`/`readdirSync`/`statSync`) on
# `Context`; I/O surface the embeddable core leaves off by default.
fs = []
# The raylib host module (`rl.*`): a windowing/drawing/input surface backed
# by raylib's C library. Opt-in because it compiles raylib (bindgen + cmake)
# and links native window/OpenGL code — only meaningful on hosts with a
# display. See `crates/runtime/src/raylib.rs`.
raylib = ["dep:raylib-sys"]
# The raygui control set (`rl.gui*`), on top of `raylib`: compiles raygui's
# C library (vendored inside raylib-sys) and gates the `Gui*` wrappers in
# raylib.rs. Implies `raylib`; a raygui build without the window/drawing
# surface would have nothing to attach controls to.
raygui = ["raylib", "raylib-sys/raygui"]

[dev-dependencies]
# Compile `.wat` module text to wasm bytes for the JS-API tests (the same
# in-process encoder wasmtest uses for the conformance corpus).
wast = { version = "258.0.0", default-features = false, features = ["wasm-module"] }
