[package]
name = "runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crux = { path = "../crux" }
parser = { path = "../parser" }
# Trimmed raylib build. Keep `SUPPORT_WINMM_HIGHRES_TIMER`: without it,
# raylib's Windows frame limiter uses the ~15.6ms Sleep granularity and
# `SetTargetFPS(60)` paces at ~30ms/frame instead of 16.6.
raylib-sys = { version = "6.0.0", default-features = false, features = ["SUPPORT_MODULE_RSHAPES", "SUPPORT_MODULE_RTEXTURES", "SUPPORT_MODULE_RTEXT", "SUPPORT_MODULE_RMODELS", "SUPPORT_MODULE_RAUDIO", "USE_AUDIO", "SUPPORT_FILEFORMAT_PNG", "SUPPORT_FILEFORMAT_WAV", "SUPPORT_TRACELOG", "SUPPORT_WINMM_HIGHRES_TIMER"], optional = true }
regexp = { path = "../regexp" }
syntax = { path = "../syntax" }
unicode = { path = "../unicode" }

[features]
# Experimental multi-agent mode (PLAN Phase 17): workers run as OS threads
# with their own realms and job queues, sharing SharedArrayBuffer blocks
# with the main agent; Atomics.wait blocks and notify wakes via a global
# waiter registry.
workers = ["crux/workers"]
# Host-filesystem globals (`fs.readFileSync`/`readdirSync`/`statSync`) on
# `Context`; I/O surface the embeddable core leaves off by default.
fs = []
# The raylib host module (`rl.*`): a windowing/drawing/input surface backed
# by raylib's C library. Opt-in because it compiles raylib (bindgen + cmake)
# and links native window/OpenGL code — only meaningful on hosts with a
# display. See `crates/runtime/src/raylib.rs`.
raylib = ["dep:raylib-sys"]
