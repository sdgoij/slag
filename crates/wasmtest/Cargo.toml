[package]
name = "wasmtest"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json = "1"
wasm = { path = "../wasm" }
wast = { version = "258.0.0", default-features = false, features = ["wasm-module"] }
wat = { version = "1.258.0", default-features = false }
runtime = { path = "../runtime" }

[features]
# The compiler harness (the `--compiled` switch, `equiv`, and the coverage
# report). ON by default, because the `runtime` build now enables `wasm/compile`
# for native targets by default: without this feature the runner's
# interpreter-forcing call is compiled out, so a plain `run` would silently stop
# being the oracle and measure the compiled path instead. `--no-default-features`
# builds the runner without the harness switches, which is only useful for the
# decoder-only checks — it cannot force the interpreter.
#   cargo run -p wasmtest -- equiv waspec/test/core
compile = ["wasm/compile"]
default = ["compile"]
