[package]
name = "stackprobe"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]

# Reading a thread's reserved stack bounds. Windows is a single `Kernel32`
# call declared inline, so it needs nothing; the Unix platforms go through
# `pthread_getattr_np` (or the `_np` accessors on Apple), whose types are not
# stable enough to re-declare.
[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "freebsd", target_os = "macos", target_os = "ios"))'.dependencies]
libc = "0.2"
