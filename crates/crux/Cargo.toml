[package]
name = "crux"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
unicode = { path = "../unicode" }
num-bigint = "0.4"
num-traits = "0.2"
ryu = "1"
half = "2"
# `pthread_getattr_np` (Linux stack-scan bounds); also pulled in by the rest
# of the workspace, so no new download.
libc = "0.2"

[features]
# Experimental multi-agent mode (PLAN Phase 17): SharedArrayBuffer storage
# becomes `Arc`-backed and the Atomics operations use real atomic accesses,
# so byte blocks can be shared across agent threads.
workers = []

[dev-dependencies]
proptest = "1"
