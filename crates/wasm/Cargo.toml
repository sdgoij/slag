[package]
name = "wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Cut 11 (wasm-to-native via Cranelift): an optional second execution path.
# Off by default at the crate level, because the feature cannot express
# "native targets only" by itself: `runtime` activates it from a
# `cfg(not(target_arch = "wasm32"))` table, so native embeds get it by default
# while a wasm32 build never does. Compilation is lazy — a body compiles on
# first reach — so instantiate pays nothing for cold bodies.
compile = [
    "dep:cranelift-codegen",
    "dep:cranelift-control",
    "dep:cranelift-frontend",
    "dep:cranelift-native",
    "dep:region",
    "dep:target-lexicon",
]

[dependencies]
# The ArrayBuffer byte block, shared with the runtime so `Memory.prototype.buffer`
# can alias a linear memory instead of copying it (`.notes/wasm-analysis.md`
# §7 item 8). A leaf crate, so the engine stays free of the JS value model.
byteblock = { path = "../byteblock" }

# Cranelift's executable-memory allocator (`region`) has no wasm32 backend, so
# the native-code path is native-only by construction. Scoping these to
# non-wasm targets keeps a wasm build that turns the feature on from dying
# inside `region` with errors that never name Slag: without the dependency in
# the graph, the `compile_error!` in `src/lib.rs` is what the build reports.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cranelift-codegen = { version = "=0.134.3", optional = true }
cranelift-control = { version = "=0.134.3", optional = true }
cranelift-frontend = { version = "=0.134.3", optional = true }
cranelift-native = { version = "=0.134.3", optional = true }
region = { version = "4", optional = true }
target-lexicon = { version = "0.13", optional = true }
