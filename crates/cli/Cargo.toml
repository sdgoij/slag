[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# The product binary is `slag`; the package stays `cli` so a future rename
# only touches this one line.
[[bin]]
name = "slag"
path = "src/main.rs"

[dependencies]
crux = { path = "../crux" }
jit = { path = "../jit", optional = true }
jsc = { path = "../jsc", optional = true }
lexer = { path = "../lexer" }
parser = { path = "../parser" }
# Defaults off so the `wasm` feature below is the single source of truth for
# the WebAssembly JS API (runtime defaults would otherwise force it back on);
# the CLI always wants `fs`.
runtime = { path = "../runtime", default-features = false, features = ["fs"] }
syntax = { path = "../syntax" }

[features]
# The Cranelift JIT: compiled by default (`--jitless` at runtime turns it off
# for a run; without this feature the flag does not exist). Build with
# `--no-default-features` for an interpreter-only binary.
default = ["jit", "wasm"]
jit = ["dep:jit"]
# The WebAssembly JS API (`WebAssembly` global): on by default; drop it with
# `--no-default-features` (keep the JIT with `--features jit`).
wasm = ["runtime/wasm"]
# The drop-in JavaScriptCore C API (`crates/jsc`): not part of the default
# workspace build; this feature builds it alongside the CLI so a release can
# ship `slag` plus the JSC-compatible library.
jsc = ["dep:jsc"]
# Expose the `rl` host module to scripts: compiles raylib's C library (needs
# a display); without the feature no `rl` global exists and no flag is needed.
raylib = ["runtime/raylib"]
# The raygui control set (`rl.gui*`), a separate opt-in on top of `raylib`;
# implies it so the `rl` global is installed by the CLI.
raygui = ["raylib", "runtime/raygui"]
