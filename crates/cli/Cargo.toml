[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# The product binary is `slag`; the package stays `cli` so a future rename
# only touches this one line.
[[bin]]
name = "slag"
path = "src/main.rs"

[dependencies]
crux = { path = "../crux" }
lexer = { path = "../lexer" }
parser = { path = "../parser" }
runtime = { path = "../runtime", features = ["fs"] }
syntax = { path = "../syntax" }
