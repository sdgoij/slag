name: CI

# The gates run in dependency order. Format + lints is the root: the workspace
# tests, the two conformance sweeps, and the Deno embedding builds all wait on
# it. The release packages and the browser-demo build wait on the three test
# gates, the demo deploys to GitHub Pages only from `main`, and a `v*` tag
# publishes the archives once the packages and the Deno builds are done.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The pinned submodules are build inputs, not just test data: the
      # `unicode` build script derives the RegExp property-escape tables from
      # the test262 corpus at compile time.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      # `rust-toolchain.toml` pins the channel and the clippy/rustfmt
      # components; `rustup show` materialises it and logs what was used.
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Workspace tests (${{ matrix.name }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # One invocation covers every crate, `jsc` included (a workspace member
      # deliberately outside `default-members`): the engine suites, the
      # vendored test262 fixtures, and the wasm decode/validation fixtures.
      - name: Test the workspace
        run: cargo test --locked --workspace
      # The workspace unifies features, so it only ever builds the engine with
      # its default `wasm` feature on. The wasm-free shapes are configurations
      # nothing else compiles: `runtime`'s own manifests promise them (the `jit`
      # and `cli` dependencies take it with `default-features = false`, which is
      # the point of that crate's manifest comment) and the README documents the
      # interpreter-only binary. Its suite runs here rather than only being
      # built, so an item that names a wasm-gated type without the feature —
      # which is how both of these broke — is caught by a gate instead of by a
      # downstream consumer's build.
      - name: Test the wasm-free engine
        run: cargo test --locked -p runtime --no-default-features --lib
      - name: Check the interpreter-only binary
        run: cargo check --locked -p cli --no-default-features --features jit

  # The sweep areas run as separate jobs, which is also how they are measured
  # locally: `annexB` is small and `language`/`built-ins` are ~24k fixtures each.
  # The Windows runner is the author's platform and its CRLF checkout takes the
  # four byte-exact fixtures out of the run (the harness skip, see the README),
  # so its totals differ by those four without changing any verdict.
  test262:
    name: test262 sweep (${{ matrix.area }}, ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        area: [language, built-ins, annexB, intl402]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The runner re-execs `target/release/sweep` for every batch, so the
      # measurement has to be the release build of the tree under test.
      - name: Build the sweep runner
        run: cargo build --locked --release -p test262
      # 30s/60s rather than the 15s local methodology: the deadline is wall
      # clock and a runner VM is slower than the dev box the README's numbers
      # were measured on by more than that — Windows reported hangs at the
      # shorter pair for fixtures this checkout runs in well under 15s. A batch
      # that overruns is not a verdict on its own: every fixture in it is
      # re-run individually under the recheck deadline, so a reported `hang` is
      # a fixture that missed that deadline by itself (measured locally: 32
      # fixtures under a 1s batch deadline still report 32 pass, 0 hang). The
      # runner exits non-zero on a `hang` as well as a `fail`/`crash`, so the
      # area is a gate, not a report. `--jobs` stays at its default (one batch
      # per core), and `pipefail` is what keeps the runner's status through
      # `tee`, which puts the report in the log as well as on disk.
      - name: Sweep ${{ matrix.area }}
        shell: bash
        run: |
          set -o pipefail
          target/release/sweep ${{ matrix.area }} --batch 32 \
            --timeout 30 --recheck-timeout 60 | tee target/sweep-${{ matrix.area }}.txt
      - name: Upload the sweep report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # The OS belongs in the name: both matrix legs sweep the same area,
          # and an artifact name has to be unique within a workflow run.
          name: sweep-${{ matrix.area }}-${{ matrix.os }}
          path: target/sweep-${{ matrix.area }}.txt
          if-no-files-found: error

  # C-1 (the JIT's working-region undercount) was a use-after-free that only a
  # per-allocation collection exposes; the conformance sweeps above run without
  # one. A small Array sample under `--gc-stress --gc-verify` is the regression
  # gate for that class of bug, and it stays small so it finishes well inside
  # the local 15s sweep discipline.
  gc-stress:
    name: GC stress smoke
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build the sweep runner
        run: cargo build --locked --release -p test262
      - name: Stress the Array built-ins
        shell: bash
        run: |
          target/release/sweep built-ins --filter "*Array*" --sample 4 \
            --gc-stress --gc-verify --timeout 15 --recheck-timeout 15
      - name: Stress the array-expression fixtures
        shell: bash
        run: |
          target/release/sweep language --filter "*array*" --sample 4 \
            --gc-stress --gc-verify --timeout 15 --recheck-timeout 15

  audit:
    name: Dependency audit
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the pinned toolchain
        run: rustup show
      # Pinned rather than `latest`, so a new advisory-tool release cannot change
      # the gate on its own. The advisory database itself is fetched at run time.
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit Cargo.lock
        run: cargo audit

  # Miri is scoped to the front end. `crux`'s conservative collector reads the
  # native stack, which Miri cannot model. The larger suites are not gated: a
  # bounded run of `-p regexp` did not finish, and `-Zmiri-report-progress`
  # showed it still executing after millions of basic blocks (interpretation
  # cost, not a hang); a bounded run of `-p parser` likewise did not finish,
  # with no diagnosis yet. The lexer and syntax layers finish in seconds.
  miri:
    name: Miri (front end)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install a nightly toolchain with Miri
        run: |
          rustup toolchain install nightly --profile minimal \
            --component miri --component rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Miri the lexer
        run: cargo +nightly miri test -p lexer --lib
      - name: Miri the syntax layer
        run: cargo +nightly miri test -p syntax --lib

  wasm:
    name: WebAssembly conformance (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # The sweep steps invoke `target/release/wasmtest` directly, which the
    # Windows runner's default PowerShell shell cannot do (it needs a path
    # prefix Git Bash supplies).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build the wasm runner
        run: cargo build --locked --release -p wasmtest
      # The suites cannot share one invocation — duplicate `.wast` names across
      # directories (memory_grow.wast in core/ and multi-memory/) collide on the
      # runner's cache key — so each is swept on its own. Every step runs even
      # after an earlier one failed, so one push reports every verdict.
      # `--strict` fails on a `pending` too, which is what turns the "0
      # pendings" claim into a gate.
      - name: Sweep the baseline core corpus
        if: always()
        run: target/release/wasmtest run --strict waspec/test/core/*.wast
      - name: Sweep exceptions
        if: always()
        run: target/release/wasmtest run --strict waspec/test/core/exceptions
      - name: Sweep simd
        if: always()
        run: target/release/wasmtest run --strict waspec/test/core/simd
      - name: Sweep relaxed-simd
        if: always()
        run: target/release/wasmtest run --strict waspec/test/core/relaxed-simd
      - name: Sweep bulk-memory
        if: always()
        run: target/release/wasmtest run --strict waspec/test/core/bulk-memory
      - name: Sweep memory64
        if: always()
        run: target/release/wasmtest run --strict waspec/test/core/memory64
      - name: Sweep multi-memory
        if: always()
        run: target/release/wasmtest run --strict waspec/test/core/multi-memory
      - name: Sweep gc
        if: always()
        run: target/release/wasmtest run --strict waspec/test/core/gc
      - name: Run the JS-API fixtures
        if: always()
        run: target/release/wasmtest jsapi waspec/test/js-api

  # The browser demo is the `wasm_binding` example (a dependency-free wasm
  # module) plus the hand-written glue in `docs/slag.js` and the UI in
  # `docs/app.js`; there is no wasm-bindgen step and no bundler. Building it
  # after the test gates keeps a broken demo out of `main` while the deploy
  # job below publishes the exact module this job produced.
  demo:
    name: Build the browser demo
    needs: [test, test262, wasm]
    # A tag run publishes the archives; it does not need a site build, and
    # skipping it also keeps the Pages artifact out of the release download.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The pinned test262 submodule is a build input, not just test data: the
      # `unicode` build script derives its tables from the fixtures at compile
      # time.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - name: Install the pinned toolchain
        run: rustup show
      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # On wasm32 the runtime's target tables leave the native Cranelift path
      # out of the graph, so the example needs no feature flags (see the
      # `wasm-compile` note in crates/runtime/Cargo.toml).
      - name: Build the demo module
        run: cargo build --locked --release -p slag --example wasm_binding --target wasm32-unknown-unknown
      # The page fetches all four files by relative path; a missing one would
      # deploy a site that fails on first load.
      - name: Assemble the site
        run: |
          cp target/wasm32-unknown-unknown/release/examples/wasm_binding.wasm docs/slag.wasm
          for file in index.html app.js slag.js slag.wasm; do
            test -s "docs/$file" || { echo "docs/$file is missing or empty" >&2; exit 1; }
          done
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests build the demo as a gate but must not publish it, and a tag
    # build is a release, not a deployment.
    needs: demo
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # Deno built with Slag as its engine on every platform the release ships, then
  # the two tracked embedding harnesses run against each — the only job that
  # builds a host on top of the engine, and the only consumer of `crates/v8`.
  # `tools/build-deno.py` clones the pinned commit, redirects the crates.io `v8`
  # the `deno_v8` facade pulls to `crates/v8`, and builds `-p deno`; the archives
  # it produces are attached to the release by `release` below.
  #
  # It needs the test262 submodule (`unicode`'s build script derives its tables
  # at compile time), its release tree runs to several GB, and two of Deno's
  # dependencies build through native tools the Windows build never needs —
  # `libsqlite3-sys` runs bindgen (libclang) and `libz-sys` builds zlib-ng
  # through cmake — so space is reclaimed and those tools installed first.
  deno:
    name: Deno (${{ matrix.name }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            ext: tar.gz
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            ext: tar.gz
          - name: windows-x86_64
            os: windows-latest
            ext: zip
    # The build and the harnesses are invoked through bash on every platform;
    # the packaging steps that need a native shell say so.
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      DENO_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /
      - name: Free disk space (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($p in @("$env:ProgramFiles\Android", "$env:ProgramFiles\dotnet", "C:\vcpkg", "C:\hostedtoolcache\windows\CodeQL")) {
            if (Test-Path $p) { Remove-Item -Recurse -Force $p -ErrorAction SilentlyContinue }
          }
          Get-PSDrive C | Select-Object Used,Free
      # Deno's release profile keeps `line-tables-only` debug info, which MSVC
      # writes as separate PDBs on top of the object files; the tree then runs
      # past a stock Windows runner's free space, so drop the debug info for this
      # platform only (codegen is unchanged).
      - name: Trim release debug info (Windows)
        if: runner.os == 'Windows'
        run: echo "CARGO_PROFILE_RELEASE_DEBUG=0" >> "$GITHUB_ENV"
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev
      # `rustup show` installs the repo's pinned toolchain; the build itself runs
      # under Deno's own `rust-toolchain.toml` (1.95.0), which rustup installs on
      # demand when cargo first runs inside `deno/`.
      - name: Install the pinned toolchain
        run: rustup show
      - name: Build Deno against the bridge
        run: |
          if command -v python3 >/dev/null; then py=python3; else py=python; fi
          "$py" tools/build-deno.py
      # Both harnesses exit non-zero on a failure, so the step gates on the exit
      # code; the summary line ("N passed, M failed") is in the log either way.
      - name: Smoke-test the Deno surface
        run: |
          deno_bin=./deno/target/release/deno
          [ -x "$deno_bin" ] || deno_bin=./deno/target/release/deno.exe
          "$deno_bin" run -A tools/deno_smoke.js
          "$deno_bin" run -A tools/deno_surface.js
      # The archive carries the Deno build's own `--version`, the same rule the
      # `build` job's archives follow.
      - name: Package the Deno release (Linux)
        if: runner.os == 'Linux'
        run: |
          version=$(./deno/target/release/deno --version | head -1 | awk '{print $2}')
          test -n "$version"
          mkdir -p dist/deno
          cp ./deno/target/release/deno LICENSE.md dist/deno/
          tar -czf "deno-${version}-${{ matrix.name }}.tar.gz" -C dist/deno .
      - name: Package the Deno release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (& .\deno\target\release\deno.exe --version | Select-Object -First 1) -split ' ' | Select-Object -Index 1
          if (-not $version) { throw "no version reported by deno --version" }
          New-Item -ItemType Directory -Force dist/deno | Out-Null
          Copy-Item .\deno\target\release\deno.exe, .\LICENSE.md dist/deno/
          Compress-Archive -Path dist/deno/* -DestinationPath "deno-$version-${{ matrix.name }}.zip" -Force
      - name: Upload the Deno package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deno-${{ matrix.name }}
          path: deno-*.${{ matrix.ext }}
          if-no-files-found: error

  # Each release is the single `slag` binary plus the readme and licence: the
  # engine embeds its assets, and the raylib variant links raylib statically.
  build:
    name: Package (${{ matrix.name }})
    needs: [test, test262, wasm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            ext: zip
          - name: linux-x86_64
            os: ubuntu-latest
            ext: tar.gz
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            ext: tar.gz
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The CLI's default features are exactly the standard surface (`jit`,
      # `wasm`), so the standard build needs no flags.
      - name: Build the standard binary
        run: cargo build --locked --release -p cli
      # The archive names carry the compiled version rather than the tag: the
      # binary is what a user downloads, so its own `--version` is the source
      # of truth for it.
      - name: Resolve the version
        shell: bash
        run: |
          version=$(cargo run --locked --release -q -p cli --bin slag -- --version | awk '{print $2}')
          test -n "$version" || { echo "no version reported by --version" >&2; exit 1; }
          echo "SLAG_VERSION=$version" >> "$GITHUB_ENV"
      # Nothing else runs a release-profile binary: the sweeps use their own,
      # and the workspace tests use debug ones.
      - name: Write the smoke script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/smoke.js" <<'JS'
          var sum = 0;
          for (var i = 0; i < 200000; i++) sum += i;
          if (sum !== 19999900000) throw new Error("arithmetic smoke failed: " + sum);
          new WebAssembly.Module(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0]));
          console.log("slag smoke ok");
          JS
      - name: Smoke-test the standard binary
        shell: bash
        run: |
          cargo run --locked --release -q -p cli --bin slag -- --version
          cargo run --locked --release -q -p cli --bin slag -- "$RUNNER_TEMP/smoke.js"
      - name: Package the standard release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/standard | Out-Null
          Copy-Item target/release/slag.exe dist/standard/
          Copy-Item README.md, LICENSE.md dist/standard/
          Compress-Archive -Path dist/standard/* -DestinationPath dist/slag-${{ env.SLAG_VERSION }}-${{ matrix.name }}.zip -Force
      - name: Package the standard release (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/standard
          cp target/release/slag README.md LICENSE.md dist/standard/
          tar -czf dist/slag-${{ env.SLAG_VERSION }}-${{ matrix.name }}.tar.gz -C dist/standard .
      - name: Upload the standard package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # The artifact name is the archive's name without its version, so the
          # two variants read the same way in the run's artifact list.
          name: slag-${{ matrix.name }}
          path: dist/slag-${{ env.SLAG_VERSION }}-${{ matrix.name }}.${{ matrix.ext }}
          if-no-files-found: error

      # raylib is compiled by cmake, and its bindings by bindgen, which needs
      # libclang. The runtime enables GLFW's Wayland backend, so GLFW needs the
      # Wayland protocol headers at build time (it dlopens libwayland-client at
      # runtime, which is why Wayland is not a link-time dependency); raylib-sys
      # still emits `-lX11`, which needs the X11 dev package to link (dropped by
      # --as-needed at runtime). Mesa covers the OpenGL it links.
      - name: Install the Linux graphics build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang libclang-dev \
            libasound2-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxext-dev \
            libgl1-mesa-dev libegl1-mesa-dev
      # The raylib build replaces `target/release/slag`, so the standard
      # archive above is packaged before this step runs.
      - name: Build the raylib binary
        run: cargo build --locked --release -p cli --features raylib,raygui
      # Installing `raylib` opens no window until a script calls
      # `rl.initWindow`, so the smoke run stays headless.
      - name: Smoke-test the raylib binary
        shell: bash
        run: |
          # The built binary is invoked directly rather than through `cargo
          # run`: run without the raylib features, cargo rebuilds the
          # default-feature CLI over it, and the step would then smoke-test (and
          # the package step below would ship) a binary with no `rl` module.
          target/release/slag "$RUNNER_TEMP/smoke.js"
          # `--help` is the usage path and exits 2, and the runner's bash runs
          # with `-o pipefail`, so the feature line is captured before it is
          # grepped: piped straight into grep, the step would fail on that
          # status no matter what grep found.
          features=$(target/release/slag --help 2>&1 || true)
          echo "$features"
          grep -q raygui <<<"$features"
      - name: Package the raylib release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/raylib | Out-Null
          Copy-Item target/release/slag.exe dist/raylib/
          Copy-Item README.md, LICENSE.md dist/raylib/
          Compress-Archive -Path dist/raylib/* -DestinationPath dist/slag-raylib-${{ env.SLAG_VERSION }}-${{ matrix.name }}.zip -Force
      - name: Package the raylib release (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/raylib
          cp target/release/slag README.md LICENSE.md dist/raylib/
          tar -czf dist/slag-raylib-${{ env.SLAG_VERSION }}-${{ matrix.name }}.tar.gz -C dist/raylib .
      - name: Upload the raylib package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: slag-raylib-${{ matrix.name }}
          path: dist/slag-raylib-${{ env.SLAG_VERSION }}-${{ matrix.name }}.${{ matrix.ext }}
          if-no-files-found: error

  # Only a tag publishes, and only when every gate above passed; ordinary pushes
  # just build and keep the artifacts.
  release:
    name: Publish release
    needs: [build, deno]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: List the assets
        run: ls -la dist
      # One checksum file for every archive. The conformance jobs upload their
      # report files as artifacts too, so the release attaches the archives and
      # this checksum by explicit pattern rather than all of `dist/*`.
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum *.zip *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          draft: false
          # A semver prerelease (`v0.2.0-rc.1`) publishes as a prerelease;
          # `v0.2.0` stays a normal release.
          prerelease: ${{ contains(github.ref_name, '-') }}
