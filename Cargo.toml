[workspace]
resolver = "2"
members = [
    "crates/unicode",
    "crates/byteblock",
    "crates/stackprobe",
    "crates/crux",
    "crates/syntax",
    "crates/lexer",
    "crates/parser",
    "crates/regexp",
    "crates/wasm",
    "crates/wasmtest",
    "crates/runtime",
    "crates/jit",
    "crates/slag",
    "crates/ffi",
    "crates/jsc",
    "crates/v8",
    "crates/quickjs",
    "crates/cli",
    "crates/test262",
    "crates/slagc",
    "crates/inspector",
]

# A bare `cargo build`/`cargo test` at the root builds these; `crates/jsc`
# (the drop-in JavaScriptCore C API) and `crates/v8` (the `rusty_v8` stand-in
# Deno is built against) are deliberately left out. Build them on request:
# `cargo build -p jsc` (or `cargo build -p cli --features jsc`), and
# `cargo build -p v8` (or `tools/build-deno.py`, the bridge's one consumer).
# `cargo build --workspace` still covers everything.
default-members = [
    "crates/unicode",
    "crates/byteblock",
    "crates/stackprobe",
    "crates/crux",
    "crates/syntax",
    "crates/lexer",
    "crates/parser",
    "crates/regexp",
    "crates/wasm",
    "crates/wasmtest",
    "crates/runtime",
    "crates/jit",
    "crates/slag",
    "crates/ffi",
    "crates/cli",
    "crates/test262",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# The profile every published binary and every benchmarked build uses. With
# cargo's default 16 codegen units, the package's source id feeds the partition
# hash, so the *same source* built two ways is laid out differently and differs
# by up to ~13% on native-dispatch paths — larger than any source change this
# journal measures, and indistinguishable from a regression from the outside.
# `codegen-units = 1` removes that freedom and `lto = "thin"` cross-crates the
# hot paths on top of it. Measured on `--jit-bench` (medians of five runs; both
# profiles built from the same tree): the interpreter column improves ~13% and
# the JIT column ~3%, and the `slag` binary is ~2% smaller. Cost: the release
# build roughly doubles, which the CI build job has the time budget for.
# Note for measurements: this is part of the measurement environment now — A/B
# two builds with the same profile, or the delta contains a layout confound.
[profile.release]
lto = "thin"
codegen-units = 1

# The same codegen as `release` plus line tables, for `tools/profile.py`'s
# symbolizer (and `llvm-symbolizer`): a release image's unwind table names only
# the functions with a public symbol, so a merged hot path — the interpreter's
# dispatch loop is a single 100 KB function — reports as whatever public symbol
# precedes it. `debug = 1` adds the line table and nothing else, so codegen, and
# therefore the timings taken from this build, are the release ones.
# Fast-iteration profile: release codegen without LTO and with parallel
# codegen units. Builds in roughly a third of the time; use it for `cargo
# test`, sweeps and A/Bs in which BOTH sides use it. Never for absolute
# corpus numbers: the layout differs from `release`.
[profile.iter]
inherits = "release"
lto = false
codegen-units = 16
debug = 0

[profile.prof]
inherits = "release"
debug = 1
